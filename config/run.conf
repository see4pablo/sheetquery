# Defaults for the non-interactive runner (run_batch.py / SheetQuery.exe).
#
# Used when the program is started with no command-line arguments
# (typical double-click on Windows).
#
# Paths are relative to the folder that contains the .exe (or the project
# root when running with Python).
#
# DATA_FILE:
#   Path to the spreadsheet, e.g. data/yeco.csv
#   Leave empty to auto-pick: if data/ has exactly one .csv/.xlsx, use it;
#   if several, use the most recently modified one.
#
# QUERIES_FILE:
#   Path to the queries JSON, e.g. queries/dani_y.json
#
# Edit this file on the friend's machine if she renames her files.

DATA_FILE=
QUERIES_FILE=queries/dani_y.json
