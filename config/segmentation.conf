# How query results are broken down in the report tables.
#
# Edit this file per project. A snapshot of the defaults lives in
# segmentation.conf.backup.
#
# Boolean values: true / false (also yes/no, 1/0).
# Header lists use the same quoting rules as column_aliases.conf:
#   NAME=HEADER
#   NAME="HEADER WITH, COMMAS", "OTHER HEADER"
# The first header present in the loaded workbook wins.

AGE_SEGMENTATION=true
# Spreadsheet headers that hold age (PSCV uses EDAD; foot-risk reports use
# "Edad a la Aplicación").
AGE_COLUMN=EDAD, "Edad a la Aplicación"
# [start:step:open+] → bands of `step` years from `start`;
# ages >= `open` go into one open-ended band ("80 and over").
# Ages below `start` are left out of the count table.
# Current CESFAM default: 15–19, 20–24, …, 75–79, 80+.
AGE_RANGE=[15:5:80+]

GENDER_SEGMENTATION=true
# Spreadsheet headers that hold sex / gender.
GENDER_COLUMN=SEXO, Sexo
